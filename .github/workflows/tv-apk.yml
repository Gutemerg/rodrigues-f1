name: APK Android TV

on:
  push:
    branches: [main]
    paths: ['tv/**', '.github/workflows/tv-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p tv assembleDebug --no-daemon

      - name: Renomear
        run: cp tv/app/build/outputs/apk/debug/app-debug.apk rodrigues-f1-tv.apk

      - name: Publicar na versão "tv"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv --yes --cleanup-tag || true
          gh release create tv rodrigues-f1-tv.apk \
            --title "RODRIGUES F1 para Android TV" \
            --notes "APK para instalar na TV (Android TV / Google TV). Gerado automaticamente."
